[package]
name = "jackson"
version = "0.1.2"
edition = "2024"
rust-version = "1.93"
description = "A low-overhead Discord music bot with persistent 24/7 mode"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
dashmap = "6.1"
dotenvy = "0.15"
humantime = "2.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
songbird = { version = "0.6.0", default-features = false, features = ["driver", "gateway", "rustls", "serenity", "tungstenite"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mkv", "mp3", "ogg", "vorbis"] }
thiserror = "2.0"
tempfile = "3.20"
tokio = { version = "1.47", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
