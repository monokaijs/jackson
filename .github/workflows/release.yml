name: Release

on:
  workflow_dispatch:
    inputs:
      version_strategy:
        description: Version to release when exact_version is empty
        type: choice
        required: true
        default: current
        options:
          - current
          - patch
          - minor
          - major
      exact_version:
        description: Optional exact SemVer, for example 1.2.3 or 2.0.0-rc.1
        type: string
        required: false
      prerelease:
        description: Mark the GitHub Release as a prerelease
        type: boolean
        required: true
        default: false
      artifact_run_id:
        description: Optional prior run ID whose build artifacts should be reused
        type: string
        required: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate semantic version
        id: version
        shell: bash
        env:
          EXACT_VERSION: ${{ inputs.exact_version }}
          VERSION_STRATEGY: ${{ inputs.version_strategy }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from the main branch." >&2
            exit 1
          fi

          package_version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1)
          latest_tag=$(git tag --list 'v*' \
            | sed -nE '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/p' \
            | sort -V \
            | tail -n 1)

          if [[ -n "$EXACT_VERSION" ]]; then
            version=${EXACT_VERSION#v}
          elif [[ "$VERSION_STRATEGY" == "current" ]]; then
            version=$package_version
          else
            base=${latest_tag#v}
            if [[ -z "$base" ]]; then
              base=$package_version
            fi
            IFS=. read -r major minor patch <<< "$base"
            case "$VERSION_STRATEGY" in
              patch) version="$major.$minor.$((patch + 1))" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              major) version="$((major + 1)).0.0" ;;
              *) echo "Unknown version strategy: $VERSION_STRATEGY" >&2; exit 1 ;;
            esac
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            prerelease=${version#*-}
            prerelease=${prerelease%%+*}
            IFS=. read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "Numeric prerelease identifiers cannot have leading zeroes: $identifier" >&2
                exit 1
              fi
            done
          fi

          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_SHA"

  verify:
    name: Verify release
    needs: prepare
    if: inputs.artifact_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, verify]
    if: inputs.artifact_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: jackson
          - runner: macos-14
            target: aarch64-apple-darwin
            executable: jackson
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: jackson.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        env:
          JACKSON_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          archive="jackson-$TAG-$TARGET"
          mkdir -p "dist/$archive"
          cp "target/$TARGET/release/$EXECUTABLE" README.md LICENSE .env.example "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          rm -rf "dist/$archive"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          $archive = "jackson-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force "dist/$archive" | Out-Null
          Copy-Item "target/$env:TARGET/release/$env:EXECUTABLE", README.md, LICENSE, .env.example "dist/$archive/"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force "dist/$archive"

      - uses: actions/upload-artifact@v4
        with:
          name: jackson-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  container:
    name: Publish container linux/${{ matrix.arch }}
    needs: [prepare, verify]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jackson
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            type=raw,value=${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ !inputs.prerelease && !contains(needs.prepare.outputs.version, '-') }}

      - name: Build and push container image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            JACKSON_RELEASE_VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}

      - name: Summarize image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "### Container image: linux/${ARCH}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}-${ARCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  container-manifest:
    name: Publish multi-architecture container manifest
    needs: [prepare, container]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.container.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish canonical image tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jackson
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          STABLE: ${{ !inputs.prerelease && !contains(needs.prepare.outputs.version, '-') }}
        run: |
          set -euo pipefail
          destinations=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:$TAG")
          if [[ "$STABLE" == "true" ]]; then
            destinations+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${destinations[@]}" \
            "$IMAGE:$VERSION-amd64" \
            "$IMAGE:$VERSION-arm64"

      - name: Inspect canonical image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jackson
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jackson-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}

      - name: Create checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' archives < <(
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
              -printf '%f\0' | sort -z
          )
          if [[ ${#archives[@]} -ne 3 ]]; then
            echo "Expected 3 release archives, found ${#archives[@]}." >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag+=(--prerelease)
          fi
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes \
            "${prerelease_flag[@]}"
